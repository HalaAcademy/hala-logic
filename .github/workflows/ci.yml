name: Build và kiểm tra host
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - run: python -m pip install -r requirements.txt
      - run: python tools/lab.py build
      - run: python tools/check_repo.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-for-host-tests
          path: build/*.elf
  host:
    needs: firmware
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: firmware-for-host-tests
          path: build
      - run: python -m pip install -r requirements.txt
      - run: python tools/lab.py test
      - run: python tools/check_repo.py
