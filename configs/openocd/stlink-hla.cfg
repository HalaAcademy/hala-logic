# Legacy fallback for ST-Link firmware without direct DAP support.
# On the tested board HLA reports a bare SIGTRAP for DWT watchpoints;
# use stlink.cfg for watchpoint acceptance.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]
adapter speed 50
reset_config none
bindto 127.0.0.1
